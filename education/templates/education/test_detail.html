{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow-lg p-4" style="background-color: #011612; border: 1px solid #10b981; color: #ecfdf5;">
        <h2 class="text-center mb-4">📝 Тест: {{ test.title }}</h2>
        <form method="POST">
            {% csrf_token %}
            {% for q in test.questions.all %}
            <div class="mb-4 p-3" style="border-left: 4px solid #10b981; background: #022c22; border-radius: 5px;">
                <h5>{{ forloop.counter }}. {{ q.text }}</h5>

                <div class="mt-3">
                    {% if q.option_a %}
                        <div class="options-group">
                            <label class="d-block p-2 border rounded mb-2" style="cursor: pointer; border-color: #065f46 !important;">
                                <input type="radio" name="q_{{ q.id }}" value="{{ q.option_a }}" required>
                                <span class="ms-2">A) {{ q.option_a }}</span>
                            </label>
                            <label class="d-block p-2 border rounded mb-2" style="cursor: pointer; border-color: #065f46 !important;">
                                <input type="radio" name="q_{{ q.id }}" value="{{ q.option_b }}">
                                <span class="ms-2">B) {{ q.option_b }}</span>
                            </label>
                            <label class="d-block p-2 border rounded mb-2" style="cursor: pointer; border-color: #065f46 !important;">
                                <input type="radio" name="q_{{ q.id }}" value="{{ q.option_c }}">
                                <span class="ms-2">C) {{ q.option_c }}</span>
                            </label>
                            <label class="d-block p-2 border rounded mb-2" style="cursor: pointer; border-color: #065f46 !important;">
                                <input type="radio" name="q_{{ q.id }}" value="{{ q.option_d }}">
                                <span class="ms-2">D) {{ q.option_d }}</span>
                            </label>
                        </div>
                    {% else %}
                        <input type="text" name="q_{{ q.id }}" class="form-control"
                               style="background-color: #000; color: #10b981; border: 1px solid #10b981;"
                               placeholder="Введите ваш ответ здесь..." required>
                    {% endif %}
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="btn w-100 fw-bold" style="background-color: #10b981; color: #000;">
                Завершить тест и получить результат
            </button>
        </form>
    </div>
</div>
{% endblock %}
